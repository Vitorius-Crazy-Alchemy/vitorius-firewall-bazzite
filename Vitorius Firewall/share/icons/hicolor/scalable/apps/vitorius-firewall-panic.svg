<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="panicGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ed333b"/>
      <stop offset="50%" stop-color="#c01c28"/>
      <stop offset="100%" stop-color="#a51d2d"/>
    </linearGradient>
    <linearGradient id="glowGradPanic" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffa348" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#c01c28" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="shadowPanic" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Base Shield Shadow & Shape in Critical Red -->
  <path d="M 64,12 C 86,22 110,22 110,22 C 110,72 88,106 64,118 C 40,106 18,72 18,22 C 18,22 42,22 64,12 Z"
        fill="url(#panicGrad)" filter="url(#shadowPanic)" stroke="#a51d2d" stroke-width="2"/>

  <!-- Inner Glow -->
  <path d="M 64,18 C 83,27 104,27 104,27 C 104,70 84,100 64,111 C 44,100 24,70 24,27 C 24,27 45,27 64,18 Z"
        fill="url(#glowGradPanic)" fill-opacity="0.4"/>

  <!-- Alert Warning Exclamation Triangle -->
  <path d="M 64,36 L 94,88 L 34,88 Z" fill="#f6d32d" stroke="#e5a50a" stroke-width="2.5" stroke-linejoin="round" filter="url(#shadowPanic)"/>
  
  <!-- Exclamation Mark -->
  <line x1="64" y1="52" x2="64" y2="72" stroke="#241f31" stroke-width="5" stroke-linecap="round"/>
  <circle cx="64" cy="80" r="3" fill="#241f31"/>
</svg>
