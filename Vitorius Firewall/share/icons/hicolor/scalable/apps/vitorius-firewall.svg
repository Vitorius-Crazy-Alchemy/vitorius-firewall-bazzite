<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3584e4"/>
      <stop offset="50%" stop-color="#1c71d8"/>
      <stop offset="100%" stop-color="#1a5fb4"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#62a0ea" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#1c71d8" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="brickGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e01b24"/>
      <stop offset="100%" stop-color="#a51d2d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Base Shield Shadow & Shape -->
  <path d="M 64,12 C 86,22 110,22 110,22 C 110,72 88,106 64,118 C 40,106 18,72 18,22 C 18,22 42,22 64,12 Z"
        fill="url(#shieldGrad)" filter="url(#shadow)" stroke="#1a5fb4" stroke-width="2"/>

  <!-- Inner Shield Glow -->
  <path d="M 64,18 C 83,27 104,27 104,27 C 104,70 84,100 64,111 C 44,100 24,70 24,27 C 24,27 45,27 64,18 Z"
        fill="url(#glowGrad)" fill-opacity="0.4"/>

  <!-- Firewall Brickwork Pattern inside Shield -->
  <g fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.9">
    <!-- Outer circuit/wall border -->
    <path d="M 40,42 L 88,42 L 88,86 L 64,98 L 40,86 Z"/>
    
    <!-- Wall courses -->
    <line x1="40" y1="56" x2="88" y2="56"/>
    <line x1="40" y1="70" x2="88" y2="70"/>
    
    <!-- Brick vertical joints -->
    <!-- Row 1 -->
    <line x1="56" y1="42" x2="56" y2="56"/>
    <line x1="72" y1="42" x2="72" y2="56"/>
    <!-- Row 2 -->
    <line x1="48" y1="56" x2="48" y2="70"/>
    <line x1="64" y1="56" x2="64" y2="70"/>
    <line x1="80" y1="56" x2="80" y2="70"/>
    <!-- Row 3 -->
    <line x1="56" y1="70" x2="56" y2="84"/>
    <line x1="72" y1="70" x2="72" y2="84"/>
  </g>

  <!-- Corporate Security Star Badge in Center -->
  <circle cx="64" cy="63" r="10" fill="#f6d32d" stroke="#e5a50a" stroke-width="2" filter="url(#shadow)"/>
  <path d="M 64,57 L 66,61 L 70,61.5 L 67,64.5 L 68,69 L 64,66.5 L 60,69 L 61,64.5 L 58,61.5 L 62,61 Z" fill="#9a6c00"/>
</svg>
